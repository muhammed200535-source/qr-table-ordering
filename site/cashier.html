function cashier(){
var h='',ts=[];
S.calls.forEach(function(c){if(c.type!=="bill"||SEEN[c.id])return;h+='<div class="alert"><span>'+L("billreq",c.table)+' · '+L("pay_"+c.method)+'</span><button data-seen="'+c.id+'">'+L("seen")+'</button></div>'});
S.orders.forEach(function(o){if(ts.indexOf(o.table)<0)ts.push(o.table)});
function bq(n){return S.calls.filter(function(c){return c.type==="bill"&&c.table===n})[0]}
ts.sort(function(a,b){return (bq(b)?1:0)-(bq(a)?1:0)||a-b});
if(!ts.length)h+='<div class="hint">'+L("noopen")+'</div>';
ts.forEach(function(n){
var os=tableOrders(n),all=[],r=bq(n);os.forEach(function(o){all=all.concat(o.items)});
h+='<div class="card'+(r?' req':'')+'"><div class="row"><b>'+L("table")+' '+n+(r?' · <span class="st s-new">'+L("reqd",L("pay_"+r.method))+'</span>':'')+'</b><span class="tot">'+tl(sum(all))+'</span></div><ul>'+all.map(function(i){return '<li>'+i.q+' × '+esc(iname(i))+' · '+tl(i.p*i.q)+'</li>'}).join('')+'</ul><div class="row" style="gap:8px;margin-top:10px">'+
(r?'<button class="btn teal" style="flex:1" data-pay="'+n+'|'+r.method+'">'+L("collect",L("pay_"+r.method))+'</button>':'<button class="btn teal" style="flex:1" data-pay="'+n+'|Nakit">'+L("closecash")+'</button><button class="btn" style="flex:1" data-pay="'+n+'|Kart">'+L("closecard")+'</button>')+'</div></div>'});
var tot=S.paid.reduce(function(a,x){return a+x.total},0),lp=S.paid[S.paid.length-1];
h+='<div class="card"><div class="row"><b>'+L("today")+'</b><span class="tot">'+tl(tot)+'</span></div><small>'+L("nclosed",S.paid.length)+(lp?' · '+L("last",lp.table)+' ('+L("pay_"+lp.method)+')':'')+'</small></div>';
if(ROLE==="owner")h+='<button class="btn alt" id="reset">'+L("reset")+'</button>';
return h}

var VIEWMAP={cashier:cashier};
function draw(){
var a=document.getElementById("app"),fe=document.activeElement&&document.activeElement.id;
var od=[].slice.call(document.querySelectorAll("details[open]")).map(function(d){return d.dataset.id});
var bn=ERR?'<div class="alert"><span>'+esc(ERR)+'</span></div>':'';
var body=!user?loginV():staffOk===false?'<div class="alert"><span>'+L(ROLE?"noaccess":"notstaff")+'</span></div>':staffOk&&loaded?VIEWMAP[view]():'<div class="hint">…</div>';
if(staffOk&&view!=="admin"&&view!=="qr"&&!SND)body='<button class="btn" id="snd" style="width:100%;margin-bottom:10px;font-size:16px">🔔 '+L("soundon")+'</button>'+body;
a.innerHTML=bn+body;
od.forEach(function(i){var d=document.querySelector('details[data-id="'+i+'"]');if(d)d.open=true});
document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.v===view);var n=staffOk?cnt(b.dataset.v):0;b.innerHTML=L("tab_"+b.dataset.v)+(n?' <span class="bdg">'+n+'</span>':"")});
document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===LANG)});document.getElementById("ttl").textContent=L("title");document.documentElement.lang=LANG;document.title=ptitle();if(!MULTI)document.getElementById("ttl").textContent=L("title")+" · "+L("tab_"+view);
var nv=document.getElementById("nav");if(nv){nv.hidden=!(user&&staffOk);nv.innerHTML='<a href="kitchen.html">'+L("tab_kitchen")+'</a><a href="service.html">'+L("tab_service")+'</a><a href="cashier.html">'+L("tab_cashier")+'</a>'}
var lo=document.getElementById("lo");lo.hidden=!user;lo.textContent=L("logout");var tabs=document.querySelector(".tabs");if(tabs)tabs.hidden=!(user&&staffOk);rtDot();
if(fe==="nt"){var n=document.getElementById("nt");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}}}

document.addEventListener("click",function(e){
unlock();var t=e.target.closest("button");if(!t)return;var D=t.dataset;
if(D.l){LANG=D.l;try{localStorage.setItem("masa_lang",LANG)}catch(x){}return draw()}
if(D.v){view=D.v;return draw()}
if(t.id==="snd"){beep();return draw()}
if(D.seen){SEEN[D.seen]=1;return draw()}
if(t.id==="li"){var em=document.getElementById("em").value.trim(),pw=document.getElementById("pw").value;lastEm=em;return db.auth.signInWithPassword({email:em,password:pw}).then(function(r){if(r.error){authErr=r.error.message;draw()}else{authErr="";user=r.data.user;return afterAuth()}})}
if(t.id==="lo"){return db.auth.signOut().then(function(){user=null;staffOk=null;loaded=false;sig="";draw()})}
if(!staffOk)return;
if(D.pay){var p=D.pay.split("|"),tn=+p[0],all=[];tableOrders(tn).forEach(function(o){all=all.concat(o.items)});
return run(db.from("payments").insert({table_no:tn,total:sum(all),method:DM(p[1]),items:all}).then(function(r){if(r.error)throw r.error;return Promise.all([db.from("orders").delete().eq("table_no",tn),db.from("calls").delete().eq("table_no",tn)])}))}
if(t.id==="reset"){return run(Promise.all([db.from("orders").delete().gt("id",0),db.from("calls").delete().gt("id",0),db.from("payments").delete().gt("id",0)]))}
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="pw")document.getElementById("li").click()});
window.addEventListener("error",function(e){var a=document.getElementById("app");if(a)a.insertAdjacentHTML("afterbegin",'<div class="alert"><span>JS: '+esc(e.message)+'</span></div>')});
draw();
db.auth.getSession().then(function(r){user=r.data&&r.data.session?r.data.session.user:null;return afterAuth()});
var tb=0;setInterval(function(){tb++;var n=staffOk?alertCount():0;if(n>0){document.title=(tb%2?"🔔 ("+n+") ":"")+L("alerttitle")+" – "+L("title");if(tb%4===0)beep()}else if(staffOk){document.title=ptitle()}},1000);
setInterval(function(){if(staffOk&&(view==="kitchen"||view==="service"))draw()},30000);
setInterval(function(){tick++;if(staffOk&&!document.hidden&&(!RT||tick%8===0))load()},2000);
</script>
</body>
</html>
