<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masa Demo – QR Sipariş Sistemi</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f4;--card:#fff;--ink:#14262b;--mute:#5d7076;--line:#d9e2e0;--acc:#e0a526;--accink:#2a1d00;--teal:#1f6f6b;--ok:#2e8b57;--bad:#c0392b;--r:14px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1d;--card:#172a2f;--ink:#e8f0ee;--mute:#92a8ac;--line:#2a4046;--teal:#4fb3ad}}
:root[data-theme="dark"]{--bg:#0f1a1d;--card:#172a2f;--ink:#e8f0ee;--mute:#92a8ac;--line:#2a4046;--teal:#4fb3ad}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Bricolage Grotesque",system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:20px;font-weight:800;margin:0;margin-right:auto}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;color:var(--mute);font:600 14px inherit;font-family:inherit;padding:7px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--teal);color:#fff}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding:14px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;color:var(--mute);font-size:14px}
select{font:600 15px inherit;font-family:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px inherit;font-family:inherit;padding:7px 14px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.em{font-size:34px;width:62px;height:62px;display:grid;place-items:center;background:var(--bg);border-radius:12px;flex:none}
.item .t{flex:1;min-width:0}.item b{display:block;font-weight:600}.item small{color:var(--mute)}
.pr{font-weight:800;white-space:nowrap}
.btn{border:0;border-radius:10px;background:var(--acc);color:var(--accink);font:800 14px inherit;font-family:inherit;padding:9px 14px;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.teal{background:var(--teal);color:#fff}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.cart{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:var(--r);padding:12px 14px;margin-top:14px}
.cart textarea{width:100%;margin:8px 0;border-radius:10px;border:1px solid var(--line);padding:8px;font:inherit;background:var(--card);color:var(--ink);resize:none}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.st{display:inline-block;font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px}
.s-new{background:#fde8b0;color:#5a3d00}.s-prep{background:#cfe8f5;color:#0d3d57}.s-ready{background:#cdeedb;color:#0f4d2a}.s-served{background:var(--line);color:var(--mute)}
.hint{color:var(--mute);text-align:center;padding:30px 10px}
.alert{background:var(--bad);color:#fff;border-radius:10px;padding:8px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.alert button{background:#fff;color:var(--bad);border:0;border-radius:8px;padding:5px 10px;font-weight:800;cursor:pointer}
ul{margin:6px 0 0;padding-left:18px}
.tot{font-size:22px;font-weight:800}
@media (prefers-reduced-motion:no-preference){.card,.item{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
.out{opacity:.55}
.card.req{border:2px solid var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.stats .card{margin:0;text-align:center}
.arow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.arow.row{justify-content:space-between}
.ad input:not([type=checkbox]),.addf input{font:inherit;font-family:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}
input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.cart{max-height:60vh;overflow:auto}
.tabs button{padding:7px 12px}
.lang{display:flex;gap:2px}.lang button{border:1px solid var(--line);background:var(--card);color:var(--mute);font:700 12px inherit;font-family:inherit;padding:5px 8px;border-radius:8px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details.ad summary{cursor:pointer}
</style>
</head>
<body>
<header>
<h1 id="ttl">Masa Demo</h1><div class="lang"><button data-l="tr">TR</button><button data-l="bg">BG</button><button data-l="en">EN</button></div>
<div class="tabs" role="tablist">
<button role="tab" data-v="guest" aria-selected="true">Misafir</button>
<button role="tab" data-v="kitchen" aria-selected="false">Mutfak</button>
<button role="tab" data-v="cashier" aria-selected="false">Kasa</button>
<button role="tab" data-v="admin" aria-selected="false">Yönetici</button>
</div>
</header>
<main id="app"></main>
<script>
var MENU=[
{id:1,c:"Başlangıçlar",n:"Mercimek çorbası",d:"Limon ve nane ile",p:140,e:"🥣"},
{id:2,c:"Başlangıçlar",n:"Humus",d:"Zeytinyağı, pul biber",p:180,e:"🧆"},
{id:3,c:"Başlangıçlar",n:"Çıtır kalamar",d:"Tartar sos ile",p:320,e:"🦑"},
{id:4,c:"Ana yemekler",n:"Karışık ızgara",d:"Köfte, tavuk, kuzu pirzola",p:620,e:"🍖"},
{id:5,c:"Ana yemekler",n:"Levrek ızgara",d:"Roka salatası ile",p:540,e:"🐟"},
{id:6,c:"Ana yemekler",n:"Mantı",d:"Yoğurt ve sarımsaklı tereyağı",p:360,e:"🥟"},
{id:7,c:"İçecekler",n:"Türk çayı",d:"İnce belli bardak",p:40,e:"🍵"},
{id:8,c:"İçecekler",n:"Ayran",d:"Köpüklü, bakır tas",p:60,e:"🥛"},
{id:9,c:"İçecekler",n:"Limonata",d:"Taze nane",p:110,e:"🍋"}];
var CATS=["Başlangıçlar","Ana yemekler","İçecekler"];
var ST={new:"Yeni",prep:"Hazırlanıyor",ready:"Hazır",served:"Servis edildi"};
var KEY="masa_demo_v1";
var S={orders:[],calls:[],paid:[],seq:1,menu:null,nid:100},billPick=false;
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
if(!S.menu){S.menu=JSON.parse(JSON.stringify(MENU));S.nid=100}
var TR9={1:{n_en:"Lentil soup",n_bg:"Леща супа",d_en:"With lemon and mint",d_bg:"С лимон и мента"},2:{n_en:"Hummus",n_bg:"Хумус",d_en:"Olive oil, chili flakes",d_bg:"Зехтин, люти люспи"},3:{n_en:"Crispy calamari",n_bg:"Хрупкави калмари",d_en:"With tartar sauce",d_bg:"С тартар сос"},4:{n_en:"Mixed grill",n_bg:"Микс от скара",d_en:"Meatballs, chicken, lamb chops",d_bg:"Кюфтета, пилешко, агнешки котлети"},5:{n_en:"Grilled sea bass",n_bg:"Лаврак на скара",d_en:"With arugula salad",d_bg:"Със салата от рукола"},6:{n_en:"Manti dumplings",n_bg:"Манти",d_en:"Yogurt and garlic butter",d_bg:"Йогурт и чесново масло"},7:{n_en:"Turkish tea",n_bg:"Турски чай",d_en:"In a tulip glass",d_bg:"В чаша лале"},8:{n_en:"Ayran",n_bg:"Айрян",d_en:"Frothy, in a copper bowl",d_bg:"Пенлив, в медна купа"},9:{n_en:"Lemonade",n_bg:"Лимонада",d_en:"With fresh mint",d_bg:"С прясна мента"}};
S.menu.forEach(function(m){var x=TR9[m.id];if(x&&m.n_en===undefined){for(var k in x)m[k]=x[k]}});
var view="guest",table=5,cat=CATS[0],cart={},note="";
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function tl(n){return n.toLocaleString("tr-TR")+" ₺"}
function sum(items){return items.reduce(function(a,i){return a+i.p*i.q},0)}
function beep(){try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.18)}catch(e){}}
function tableOrders(t){return S.orders.filter(function(o){return o.table===t})}

var LANG="tr";try{LANG=localStorage.getItem("masa_lang")||(/^bg/i.test(navigator.language)?"bg":/^en/i.test(navigator.language)?"en":"tr")}catch(e){}
var K={
title:["Masa Demo","Table Demo","Маса Демо"],
tab_guest:["Misafir","Guest","Гост"],tab_kitchen:["Mutfak","Kitchen","Кухня"],tab_cashier:["Kasa","Cashier","Каса"],tab_admin:["Yönetici","Admin","Админ"],
table:["Masa","Table","Маса"],
qr:["QR okutuldu, uygulama gerekmedi.","QR scanned, no app needed.","QR кодът е сканиран, без приложение."],
out:["Tükendi","Sold out","Изчерпано"],dec:["Azalt","Decrease","Намали"],inc:["Artır","Increase","Увеличи"],add:["Ekle","Add","Добави"],
cart:["Sepetiniz","Your cart","Вашата кошница"],
nph:["Sipariş notu (örn. acısız)","Order note (e.g. not spicy)","Бележка към поръчката (напр. без люто)"],
note:["Not","Note","Бележка"],
ctot:["Sepet toplamı","Cart total","Общо в кошницата"],
send:["Siparişi gönder","Place order","Изпрати поръчката"],
yours:["Masa {n} siparişleriniz","Your orders at table {n}","Вашите поръчки за маса {n}"],
none:["Henüz sipariş yok. Menüden ürün ekleyin.","No orders yet. Add items from the menu.","Все още няма поръчки. Добавете артикули от менюто."],
order:["Sipariş","Order","Поръчка"],
mtot:["Masa toplamı","Table total","Общо за масата"],
billsent:["Hesap kasaya iletildi.","Bill sent to the cashier.","Сметката е изпратена на касата."],
billsub:["Ödeme yöntemi: {n}. Kasa hesabı masanıza getirecek.","Payment method: {n}. The cashier will bring the bill to your table.","Начин на плащане: {n}. Касиерът ще донесе сметката до масата ви."],
howpay:["Nasıl ödemek istersiniz?","How would you like to pay?","Как желаете да платите?"],
pay_Nakit:["Nakit","Cash","В брой"],pay_Kart:["Kart","Card","Карта"],
cancel:["Vazgeç","Cancel","Отказ"],
call:["Garson çağır","Call waiter","Извикай сервитьор"],bill:["Hesap iste","Ask for the bill","Поискай сметката"],
calling:["Garson geliyor","Waiter is coming","Сервитьорът идва"],
wcall:["Masa {n}: garson çağırıyor","Table {n}: calling a waiter","Маса {n}: вика сервитьор"],
ok:["Tamam","Done","Готово"],
knone:["Bekleyen sipariş yok. Misafir ekranından sipariş verin.","No pending orders. Place an order from the Guest screen.","Няма чакащи поръчки. Направете поръчка от екрана за гости."],
st_new:["Yeni","New","Нова"],st_prep:["Hazırlanıyor","Preparing","Приготвя се"],st_ready:["Hazır","Ready","Готова"],st_served:["Servis edildi","Served","Сервирана"],
nx_new:["Hazırlamaya başla","Start preparing","Започни приготвянето"],nx_prep:["Hazır","Ready","Готова"],nx_ready:["Servis edildi","Served","Сервирана"],
noopen:["Açık masa yok.","No open tables.","Няма отворени маси."],
reqd:["Hesap istendi: {n}","Bill requested: {n}","Поискана сметка: {n}"],
collect:["{n} tahsil et ve masayı kapat","Collect {n} and close table","Получи {n} и затвори масата"],
closecash:["Nakit kapat","Close: cash","Затвори: в брой"],closecard:["Kartla kapat","Close: card","Затвори: карта"],
today:["Bugünkü satış","Today’s sales","Продажби днес"],
nclosed:["{n} hesap kapatıldı","{n} bills closed","{n} затворени сметки"],
last:["son: Masa {n}","last: Table {n}","последна: Маса {n}"],
reset:["Siparişleri ve satışları sıfırla","Reset orders and sales","Нулирай поръчките и продажбите"],
sales:["Satış","Sales","Продажби"],open:["Açık sipariş","Open orders","Отворени поръчки"],prod:["Ürün","Products","Артикули"],
top:["En çok satanlar","Top sellers","Най-продавани"],pcs:["{n} adet","{n} pcs","{n} бр."],nosales:["Henüz satış yok.","No sales yet.","Още няма продажби."],
menumgmt:["Menü yönetimi","Menu management","Управление на менюто"],newp:["Yeni ürün","New product","Нов артикул"],
fe:["Emoji","Emoji","Емоджи"],fn:["Ürün adı (Türkçe)","Name (Turkish)","Име (турски)"],fne:["Ürün adı (İngilizce)","Name (English)","Име (английски)"],fnb:["Ürün adı (Bulgarca)","Name (Bulgarian)","Име (български)"],
fp:["Fiyat","Price","Цена"],fc:["Kategori","Category","Категория"],
fd:["Açıklama (Türkçe)","Description (Turkish)","Описание (турски)"],fde:["Açıklama (İngilizce)","Description (English)","Описание (английски)"],fdb:["Açıklama (Bulgarca)","Description (Bulgarian)","Описание (български)"],
addp:["Ürün ekle","Add product","Добави артикул"],del:["Sil","Delete","Изтрий"],
trhint:["Boş bırakılan çeviri Türkçe metni gösterir.","An empty translation shows the Turkish text.","Празен превод показва турския текст."],
noauth:["Demoda giriş yok. Gerçek sistemde bu ekran yalnızca sahip ve müdür rolüne açılır.","No login in the demo. In the real system this screen is only open to owner and manager roles.","В демото няма вход. В реалната система този екран е достъпен само за собственик и мениджър."]
};
var T={tr:{},en:{},bg:{}};Object.keys(K).forEach(function(k){T.tr[k]=K[k][0];T.en[k]=K[k][1];T.bg[k]=K[k][2]});
var CT={"Başlangıçlar":{en:"Starters",bg:"Предястия"},"Ana yemekler":{en:"Main courses",bg:"Основни ястия"},"İçecekler":{en:"Drinks",bg:"Напитки"},"Diğer":{en:"Other",bg:"Други"}};
function L(k,n){var x=T[LANG][k]||T.tr[k]||k;return n===undefined?x:x.replace("{n}",n)}
function cn(c){return LANG!=="tr"&&CT[c]?CT[c][LANG]:c}
function pn(m){return LANG==="tr"?m.n:(m["n_"+LANG]||m.n)}
function pd(m){return LANG==="tr"?(m.d||""):(m["d_"+LANG]||m.d||"")}
function iname(i){var m=i.id&&S.menu.filter(function(x){return x.id===i.id})[0];return m?pn(m):i.n}
function qa(x){return String(x).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function cats(){var c=[];S.menu.forEach(function(m){if(c.indexOf(m.c)<0)c.push(m.c)});return c}

function guest(){
var cs=cats();if(cs.indexOf(cat)<0)cat=cs[0];
var h='<div class="bar"><label for="tb">'+L("table")+'</label><select id="tb">';
for(var i=1;i<=12;i++)h+='<option value="'+i+'"'+(i===table?' selected':'')+'>'+L("table")+' '+i+'</option>';
h+='</select><span>'+L("qr")+'</span></div>';
h+='<div class="chips">'+cs.map(function(c){return '<button data-cat="'+qa(c)+'" aria-pressed="'+(c===cat)+'">'+esc(cn(c))+'</button>'}).join('')+'</div>';
S.menu.filter(function(m){return m.c===cat}).forEach(function(m){
var q=cart[m.id]||0;
h+='<div class="item'+(m.out?' out':'')+'"><div class="em" aria-hidden="true">'+esc(m.e)+'</div><div class="t"><b>'+esc(pn(m))+'</b><small>'+esc(pd(m))+'</small><div class="pr">'+tl(m.p)+'</div></div>';
h+=m.out?'<span class="st s-served">'+L("out")+'</span>':q?'<div class="qty"><button data-dec="'+m.id+'" aria-label="'+L("dec")+'">−</button><b>'+q+'</b><button data-inc="'+m.id+'" aria-label="'+L("inc")+'">+</button></div>':'<button class="btn" data-inc="'+m.id+'">'+L("add")+'</button>';
h+='</div>'});
var items=S.menu.filter(function(m){return cart[m.id]&&!m.out}).map(function(m){return{id:m.id,n:pn(m),p:m.p,q:cart[m.id]}});
if(items.length){
h+='<div class="cart"><b>'+L("cart")+'</b>'+items.map(function(i){return '<div class="row" style="margin:8px 0;gap:10px"><span style="flex:1">'+esc(i.n)+'<br><small style="opacity:.7">'+tl(i.p)+' × '+i.q+'</small></span><div class="qty"><button data-dec="'+i.id+'" aria-label="'+L("dec")+'">−</button><b>'+i.q+'</b><button data-inc="'+i.id+'" aria-label="'+L("inc")+'">+</button></div><b style="min-width:72px;text-align:right">'+tl(i.p*i.q)+'</b></div>'}).join('')+
'<textarea id="nt" rows="2" aria-label="'+L("note")+'" placeholder="'+qa(L("nph"))+'">'+esc(note)+'</textarea><div class="row" style="margin-bottom:8px"><span>'+L("ctot")+'</span><b class="tot">'+tl(sum(items))+'</b></div><button class="btn" id="send" style="width:100%">'+L("send")+'</button></div>'}
var mine=tableOrders(table),all=[];mine.forEach(function(o){all=all.concat(o.items)});
h+='<h2 style="font-size:18px;margin:20px 0 8px">'+L("yours",table)+'</h2>';
if(!mine.length)h+='<div class="hint">'+L("none")+'</div>';
mine.forEach(function(o){h+='<div class="card"><div class="row"><b>'+L("order")+' #'+o.id+'</b><span class="st s-'+o.status+'">'+L("st_"+o.status)+'</span></div><ul>'+o.items.map(function(i){return '<li>'+i.q+' × '+esc(iname(i))+'</li>'}).join('')+'</ul>'+(o.note?'<small>'+L("note")+': '+esc(o.note)+'</small>':'')+'</div>'});
if(mine.length)h+='<div class="row" style="margin-bottom:10px"><span>'+L("mtot")+'</span><b class="tot">'+tl(sum(all))+'</b></div>';
var br=S.calls.filter(function(c){return c.type==="bill"&&c.table===table})[0];
if(br)h+='<div class="card"><b>'+L("billsent")+'</b><br><small>'+L("billsub",L("pay_"+br.method))+'</small></div>';
else if(billPick)h+='<div class="card"><b>'+L("howpay")+'</b><div class="row" style="gap:8px;margin-top:10px"><button class="btn teal" data-bm="Nakit" style="flex:1">'+L("pay_Nakit")+'</button><button class="btn" data-bm="Kart" style="flex:1">'+L("pay_Kart")+'</button></div><button class="btn alt" id="bcancel" style="width:100%;margin-top:8px">'+L("cancel")+'</button></div>';
else h+='<div class="row" style="gap:10px"><button class="btn alt" id="call" style="flex:1">'+L("call")+'</button><button class="btn teal" id="bill" style="flex:1"'+(mine.length?'':' disabled')+'>'+L("bill")+'</button></div>';
return h}

function kitchen(){
var h='';
S.calls.forEach(function(c,i){if(c.type!=="waiter")return;h+='<div class="alert"><span>'+L("wcall",c.table)+'</span><button data-clr="'+i+'">'+L("ok")+'</button></div>'});
var act=S.orders.filter(function(o){return o.status!=="served"});
if(!act.length)h+='<div class="hint">'+L("knone")+'</div>';
act.forEach(function(o){
h+='<div class="card"><div class="row"><b>'+L("table")+' '+o.table+' · #'+o.id+'</b><span class="st s-'+o.status+'">'+L("st_"+o.status)+'</span></div><ul>'+o.items.map(function(i){return '<li><b>'+i.q+' ×</b> '+esc(iname(i))+'</li>'}).join('')+'</ul>'+(o.note?'<p style="margin:8px 0 0"><b>'+L("note")+':</b> '+esc(o.note)+'</p>':'')+'<button class="btn teal" style="margin-top:10px" data-adv="'+o.id+'">'+L("nx_"+o.status)+'</button></div>'});
return h}

function cashier(){
var h='',ts=[];
S.orders.forEach(function(o){if(ts.indexOf(o.table)<0)ts.push(o.table)});
function bq(n){return S.calls.filter(function(c){return c.type==="bill"&&c.table===n})[0]}
ts.sort(function(a,b){return (bq(b)?1:0)-(bq(a)?1:0)||a-b});
if(!ts.length)h+='<div class="hint">'+L("noopen")+'</div>';
ts.forEach(function(n){
var os=tableOrders(n),all=[],r=bq(n);os.forEach(function(o){all=all.concat(o.items)});
h+='<div class="card'+(r?' req':'')+'"><div class="row"><b>'+L("table")+' '+n+(r?' · <span class="st s-new">'+L("reqd",L("pay_"+r.method))+'</span>':'')+'</b><span class="tot">'+tl(sum(all))+'</span></div><ul>'+all.map(function(i){return '<li>'+i.q+' × '+esc(iname(i))+' · '+tl(i.p*i.q)+'</li>'}).join('')+'</ul><div class="row" style="gap:8px;margin-top:10px">'+
(r?'<button class="btn teal" style="flex:1" data-pay="'+n+'|'+r.method+'">'+L("collect",L("pay_"+r.method))+'</button>':'<button class="btn teal" style="flex:1" data-pay="'+n+'|Nakit">'+L("closecash")+'</button><button class="btn" style="flex:1" data-pay="'+n+'|Kart">'+L("closecard")+'</button>')+'</div></div>'});
var tot=S.paid.reduce(function(a,x){return a+x.total},0),lp=S.paid[S.paid.length-1];
h+='<div class="card"><div class="row"><b>'+L("today")+'</b><span class="tot">'+tl(tot)+'</span></div><small>'+L("nclosed",S.paid.length)+(lp?' · '+L("last",lp.table)+' ('+L("pay_"+lp.method)+')':'')+'</small></div>';
h+='<button class="btn alt" id="reset">'+L("reset")+'</button>';
return h}

function admin(){
var tot=S.paid.reduce(function(a,x){return a+x.total},0),m={},h='';
S.paid.forEach(function(x){(x.items||[]).forEach(function(i){var k=i.id||i.n;m[k]=(m[k]||0)+i.q})});
var top=Object.keys(m).sort(function(a,b){return m[b]-m[a]}).slice(0,3);
h+='<div class="stats"><div class="card"><small>'+L("sales")+'</small><div class="tot">'+tl(tot)+'</div></div><div class="card"><small>'+L("open")+'</small><div class="tot">'+S.orders.filter(function(o){return o.status!=="served"}).length+'</div></div><div class="card"><small>'+L("prod")+'</small><div class="tot">'+S.menu.length+'</div></div></div>';
h+='<div class="card"><b>'+L("top")+'</b>'+(top.length?'<ul>'+top.map(function(k){var mm=S.menu.filter(function(x){return String(x.id)===k})[0];return '<li>'+esc(mm?pn(mm):k)+' · '+L("pcs",m[k])+'</li>'}).join('')+'</ul>':'<div><small>'+L("nosales")+'</small></div>')+'</div>';
h+='<datalist id="cl">'+cats().map(function(c){return '<option value="'+qa(c)+'">'}).join('')+'</datalist>';
h+='<h2 style="font-size:18px;margin:18px 0 4px">'+L("menumgmt")+'</h2><small style="color:var(--mute);display:block;margin-bottom:8px">'+L("trhint")+'</small>';
h+='<div class="card addf"><b>'+L("newp")+'</b><div class="arow" style="margin-top:8px"><input id="na_e" aria-label="'+L("fe")+'" placeholder="🍽️" maxlength="2" style="width:56px"><input id="na_n" aria-label="'+L("fn")+'" placeholder="'+qa(L("fn"))+'" style="flex:1"></div><div class="arow"><input id="na_ne" aria-label="'+L("fne")+'" placeholder="'+qa(L("fne"))+'" style="flex:1"><input id="na_nb" aria-label="'+L("fnb")+'" placeholder="'+qa(L("fnb"))+'" style="flex:1"></div><div class="arow"><input id="na_p" type="number" inputmode="numeric" min="0" aria-label="'+L("fp")+'" placeholder="'+L("fp")+'" style="width:100px"><input id="na_c" list="cl" aria-label="'+L("fc")+'" placeholder="'+L("fc")+'" style="flex:1"></div><div class="arow"><input id="na_d" aria-label="'+L("fd")+'" placeholder="'+qa(L("fd"))+'" style="flex:1"><button class="btn" id="addp">'+L("addp")+'</button></div></div>';
S.menu.forEach(function(x){
var id=' data-id="'+x.id+'"';
var inp=function(f,ph,val,st,ty){return '<input data-f="'+f+'"'+id+(ty?' type="number" inputmode="numeric" min="0"':'')+' aria-label="'+qa(ph)+'" placeholder="'+qa(ph)+'" value="'+qa(val)+'" style="'+st+'">'};
h+='<details class="card ad"><summary><span aria-hidden="true">'+esc(x.e)+'</span> <b>'+esc(pn(x))+'</b> · '+tl(x.p)+(x.out?' · '+L("out"):'')+'</summary><div style="margin-top:10px">'+
'<div class="arow">'+inp("e",L("fe"),x.e,"width:56px")+inp("n",L("fn"),x.n,"flex:1")+'</div>'+
'<div class="arow">'+inp("n_en",L("fne"),x.n_en||"","flex:1")+inp("n_bg",L("fnb"),x.n_bg||"","flex:1")+'</div>'+
'<div class="arow">'+inp("p",L("fp"),x.p,"width:100px",1)+'<input data-f="c"'+id+' list="cl" aria-label="'+L("fc")+'" value="'+qa(x.c)+'" style="flex:1"></div>'+
'<div class="arow">'+inp("d",L("fd"),x.d||"","flex:1")+'</div><div class="arow">'+inp("d_en",L("fde"),x.d_en||"","flex:1")+'</div><div class="arow">'+inp("d_bg",L("fdb"),x.d_bg||"","flex:1")+'</div>'+
'<div class="arow row"><label><input type="checkbox" data-f="out"'+id+(x.out?' checked':'')+'> '+L("out")+'</label><button class="btn alt" data-del="'+x.id+'">'+L("del")+'</button></div></div></details>'});
h+='<small class="hint" style="display:block">'+L("noauth")+'</small>';
return h}

function draw(){
var a=document.getElementById("app"),fe=document.activeElement&&document.activeElement.id;
a.innerHTML=view==="guest"?guest():view==="kitchen"?kitchen():view==="admin"?admin():cashier();
document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.v===view);b.textContent=L("tab_"+b.dataset.v)});document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===LANG)});document.getElementById("ttl").textContent=L("title");document.documentElement.lang=LANG;document.title=L("title")+" – QR";
if(fe==="nt"){var n=document.getElementById("nt");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}}}

document.addEventListener("click",function(e){
var t=e.target.closest("button");if(!t)return;
if(t.dataset.l){LANG=t.dataset.l;try{localStorage.setItem("masa_lang",LANG)}catch(e){}return draw()}
if(t.dataset.v){view=t.dataset.v;return draw()}
if(t.dataset.cat){cat=t.dataset.cat;return draw()}
if(t.dataset.inc){cart[t.dataset.inc]=(cart[t.dataset.inc]||0)+1;return draw()}
if(t.dataset.dec){var k=t.dataset.dec;cart[k]--;if(cart[k]<=0)delete cart[k];return draw()}
if(t.id==="send"){var it=S.menu.filter(function(m){return cart[m.id]&&!m.out}).map(function(m){return{id:m.id,n:m.n,p:m.p,q:cart[m.id]}});
S.orders.push({id:S.seq++,table:table,items:it,note:note.trim(),status:"new"});cart={};note="";save();return draw()}
if(t.id==="call"){S.calls.push({table:table,type:"waiter"});save();t.textContent=L("calling");return}
if(t.id==="bill"){billPick=true;return draw()}
if(t.id==="bcancel"){billPick=false;return draw()}
if(t.dataset.bm){S.calls.push({table:table,type:"bill",method:t.dataset.bm});billPick=false;save();return draw()}
if(t.dataset.del){var di=+t.dataset.del;S.menu=S.menu.filter(function(x){return x.id!==di});delete cart[di];save();return draw()}
if(t.id==="addp"){var g=function(i){return document.getElementById(i).value.trim()},nn=g("na_n"),np=+g("na_p");if(!nn||!(np>=0)||g("na_p")==="")return;
S.menu.push({id:S.nid++,c:g("na_c")||"Diğer",n:nn,n_en:g("na_ne"),n_bg:g("na_nb"),p:np,e:g("na_e")||"🍽️",d:g("na_d")});save();return draw()}
if(t.dataset.clr){S.calls.splice(+t.dataset.clr,1);save();return draw()}
if(t.dataset.adv){var o=S.orders.filter(function(x){return x.id==t.dataset.adv})[0];o.status={new:"prep",prep:"ready",ready:"served"}[o.status];save();return draw()}
if(t.dataset.pay){var p=t.dataset.pay.split("|"),tn=+p[0],os=tableOrders(tn),all=[];os.forEach(function(o){all=all.concat(o.items)});
S.paid.push({table:tn,total:sum(all),method:p[1],items:all});S.orders=S.orders.filter(function(o){return o.table!==tn});S.calls=S.calls.filter(function(c){return c.table!==tn});save();return draw()}
if(t.id==="reset"){S.orders=[];S.calls=[];S.paid=[];S.seq=1;save();draw()}
});
document.addEventListener("change",function(e){var x=e.target;if(x.id==="tb"){table=+x.value;return draw()}
if(x.dataset&&x.dataset.f){var it=S.menu.filter(function(m){return m.id==x.dataset.id})[0];if(!it)return;var f=x.dataset.f;
if(f==="p")it.p=Math.max(0,+x.value||0);else if(f==="out")it.out=x.checked;else if(/_/.test(f))it[f]=x.value.trim();else it[f]=x.value.trim()||it[f];
save();if(f==="c")draw()}});
document.addEventListener("input",function(e){if(e.target.id==="nt")note=e.target.value});
window.addEventListener("storage",function(e){if(e.key!==KEY||!e.newValue)return;var prev=S.orders.length;try{S=JSON.parse(e.newValue)}catch(x){return}
if(view==="kitchen"&&S.orders.length>prev)beep();draw()});
draw();
</script>
</body>
</html>
